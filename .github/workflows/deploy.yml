name: Deploy Tipde to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and prerender
        run: npm run build
        env:
          VITE_SITE_URL: https://tipde.online
          # Project URL needs /tipde/. Set the repository variable VITE_BASE_PATH
          # to "/" once tipde.online is serving this Pages site.
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/tipde/' }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GSC_VERIFICATION: ${{ secrets.VITE_GSC_VERIFICATION }}
          VITE_MONETAG_ID: ${{ vars.VITE_MONETAG_ID || 'c779a9462a921abf9636fcd4e1e40fad' }}
          VITE_MONETAG_ZONE: ${{ vars.VITE_MONETAG_ZONE || '316799' }}
          VITE_MONETAG_VIGNETTE_ZONE: ${{ vars.VITE_MONETAG_VIGNETTE_ZONE || '12373469' }}
          VITE_MONETAG_VIGNETTE_ZONE_2: ${{ vars.VITE_MONETAG_VIGNETTE_ZONE_2 || '12374408' }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
