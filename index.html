<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3985ef" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          if (JSON.parse(localStorage.getItem('tipde:theme') || '"light"') === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (error) {
          // Keep the light theme if stored preferences are unavailable.
        }
      })()
    </script>
    <!--app-head-->
  </head>
  <body class="bg-canvas text-ink antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
